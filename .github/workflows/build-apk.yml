name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (no AI keys)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew :sample-app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp sample-app/build/outputs/apk/debug/sample-app-debug.apk MYVU-Sample.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MYVU Sample build ${{ github.run_number }}
          files: MYVU-Sample.apk
